# -----------------------------------------------------------------------------
# 工作流：解压并合并分卷/分片压缩包（健壮版 v2）
# - 识别 _part1/_part2...、_vol1、.part1 等分卷命名，归并为同一组
# - 同组所有分卷解压到同一文件夹（同名根目录自动合并）
# - 非分卷普通压缩包解压到各自独立同名文件夹
# - zip 文件名自动修复 mojibake（UTF-8 ↔ CP1252/Latin-1 迭代还原）
# - 路径穿越检查、自然排序、解压总量上限、失败退出码
# -----------------------------------------------------------------------------

name: 自动解压并合并分卷压缩包
on:
  push:
    branches: [ main, master, GM82 ]
    paths:
      - '**.zip'
      - '**.7z'
      - '**.rar'
      - '**.tar'
      - '**.tar.gz'
      - '**.tgz'
      - '**.tar.bz2'
      - '**.tar.xz'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract_all_archives:
    runs-on: ubuntu-22.04
    if: github.actor != 'github-actions[bot]'
    concurrency:
      group: extract-archives-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装解压依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y p7zip-full unrar

      - name: 查找、归组、解压合并、暂存并删除压缩包
        run: |
          python3 - <<'PYEOF'
          #!/usr/bin/env python3
          """解压并合并分卷压缩包，自动修复 Windows 文件名 mojibake。"""
          import os, re, sys, shutil, subprocess, zipfile, tarfile
          from pathlib import Path

          ROOT = Path('.')
          ARCHIVE_EXTS = ('.zip', '.7z', '.rar', '.tar', '.tar.gz',
                          '.tar.bz2', '.tar.xz', '.tgz')
          PART_RE = re.compile(r'[._-](part|pt|vol)[0-9]{1,3}$', re.I)
          BOMB_LIMIT = 20 * 1024 * 1024 * 1024   # 20GB 解压上限

          # ── 基础工具 ──────────────────────────────────────────
          def is_archive(name):
              return name.lower().endswith(ARCHIVE_EXTS)

          def strip_ext(name):
              low = name.lower()
              for ext in sorted(ARCHIVE_EXTS, key=len, reverse=True):
                  if low.endswith(ext):
                      return name[:-len(ext)]
              return name

          def group_key(path):
              return path.parent / PART_RE.sub('', strip_ext(path.name))

          def natural_key(p):
              return [(0, int(t)) if t.isdigit() else (1, t.lower())
                      for t in re.split(r'(\d+)', str(p))]

          def has_control(s):
              return any(ord(c) < 32 for c in s)

          # ── mojibake 迭代修复 ─────────────────────────────────
          # 原理：损坏名 = UTF-8 字节被按 CP1252/Latin-1 解码后，
          #       再以 UTF-8 存回。反复 encode(legacy).decode(utf-8)
          #       即可逐层剥回原始 UTF-8 字符串。
          def fix_mojibake(s, max_rounds=8):
              if not s or s.isascii():
                  return s
              cur = s
              for _ in range(max_rounds):
                  changed = False
                  for enc in ('cp1252', 'latin-1'):
                      try:
                          raw = cur.encode(enc)
                      except UnicodeEncodeError:
                          continue
                      try:
                          dec = raw.decode('utf-8')
                      except UnicodeDecodeError:
                          continue
                      if dec != cur and not has_control(dec):
                          cur = dec
                          changed = True
                          break
                  if not changed:
                      break
              return cur

          # ── 路径安全 ──────────────────────────────────────────
          def safe_target(dest, name):
              name = name.replace('\\', '/')
              parts = [p for p in name.split('/') if p not in ('', '.')]
              if any(p == '..' for p in parts):
                  raise ValueError(f'路径穿越: {name!r}')
              target = dest.joinpath(*parts)
              try:
                  target.resolve().relative_to(dest.resolve())
              except ValueError:
                  raise ValueError(f'路径穿越: {name!r}')
              return target

          def unique_target(target):
              if not target.exists():
                  return target
              stem, suffix = target.stem, target.suffix
              n = 2
              while True:
                  cand = target.parent / f'{stem} ({n}){suffix}'
                  if not cand.exists():
                      return cand
                  n += 1

          # ── 解压总量守卫（用实例，避免 nonlocal 作用域坑）──
          class BombGuard:
              def __init__(self, limit=BOMB_LIMIT):
                  self.limit = limit
                  self.total = 0
              def add(self, n):
                  self.total += n
                  if self.total > self.limit:
                      raise RuntimeError(
                          f'解压总量 {self.total} 超过上限 {self.limit}，疑似 zip bomb')

          # ── 各格式解压 ────────────────────────────────────────
          def extract_zip(path, dest, guard):
              with zipfile.ZipFile(path) as zf:
                  for info in zf.infolist():
                      raw_name = info.filename
                      name = fix_mojibake(raw_name)
                      if name != raw_name:
                          print(f'     [编码修复] {raw_name!r}')
                          print(f'              -> {name!r}')
                      if not name:
                          continue
                      target = safe_target(dest, name)
                      if info.is_dir() or name.endswith('/'):
                          target.mkdir(parents=True, exist_ok=True)
                          continue
                      target.parent.mkdir(parents=True, exist_ok=True)
                      if name != raw_name:
                          # 修复后的名字可能与其他 mojibake 变体重名 → 加后缀
                          target = unique_target(target)
                      with zf.open(info) as src, open(target, 'wb') as dst:
                          shutil.copyfileobj(src, dst)
                      guard.add(info.file_size)
                      mode = (info.external_attr >> 16) & 0o777
                      if mode:
                          try: os.chmod(target, mode)
                          except OSError: pass

          def extract_tar(path, dest, guard):
              with tarfile.open(path) as tf:
                  for m in tf.getmembers():
                      name = fix_mojibake(m.name)
                      if not name:
                          continue
                      if m.isdir():
                          safe_target(dest, name).mkdir(parents=True, exist_ok=True)
                          continue
                      if not m.isfile():
                          continue
                      target = safe_target(dest, name)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      if name != m.name:
                          target = unique_target(target)
                      src = tf.extractfile(m)
                      if src is None:
                          continue
                      with src, open(target, 'wb') as dst:
                          shutil.copyfileobj(src, dst)
                      guard.add(m.size)
                      if m.mode:
                          try: os.chmod(target, m.mode & 0o777)
                          except OSError: pass

          def run(cmd):
              r = subprocess.run(cmd, capture_output=True)
              if r.returncode != 0:
                  raise RuntimeError(r.stderr.decode('utf-8', 'replace')[:800])

          def extract(path, dest, guard):
              dest.mkdir(parents=True, exist_ok=True)
              low = path.name.lower()
              if low.endswith('.zip'):
                  extract_zip(path, dest, guard)
              elif low.endswith(('.tar.gz', '.tgz', '.tar.bz2', '.tar.xz', '.tar')):
                  extract_tar(path, dest, guard)
              elif low.endswith('.7z'):
                  run(['7z', 'x', str(path), f'-o{dest}', '-y', '-bso0', '-bsp0'])
              elif low.endswith('.rar'):
                  run(['unrar', 'x', '-o+', '-idq', str(path), f'{dest}/'])
              else:
                  raise ValueError(f'未知格式: {path}')

          # ── 主流程 ────────────────────────────────────────────
          def find_archives(root):
              out = []
              for dirpath, dirnames, filenames in os.walk(root):
                  dirnames[:] = [d for d in dirnames if d != '.git']
                  for f in filenames:
                      if is_archive(f):
                          out.append(Path(dirpath) / f)
              return out

          def main():
              archives = find_archives(ROOT)
              if not archives:
                  print('未找到压缩文件。')
                  return 0
              print(f'找到 {len(archives)} 个压缩文件，开始归组...')

              groups = {}
              for p in archives:
                  k = group_key(p)
                  groups.setdefault(k, []).append(p)
                  print(f'  归组: {p}  ->  {k}')

              guard = BombGuard()
              fail = 0
              for key in sorted(groups, key=natural_key):
                  parts = sorted(groups[key], key=natural_key)
                  dest = key
                  print(f'=== 组 ({len(parts)} 个分卷) -> {dest} ===')
                  ok = 0
                  for p in parts:
                      if not p.is_file():
                          continue
                      try:
                          print(f'  -> {p}')
                          extract(p, dest, guard)
                          print('     解压成功，删除原文件。')
                          p.unlink()
                          run(['git', 'add', '--', str(p)])
                          ok += 1
                      except Exception as e:
                          print(f'     解压失败: {e}，保留该分卷。')
                          fail += 1
                  if ok > 0:
                      print(f'  -> 暂存合并目录: {dest}')
                      run(['git', 'add', '--force', '--', str(dest)])
                  try:
                      dest.rmdir()
                  except OSError:
                      pass
              print(f'=== 全部处理完毕，失败分卷数: {fail} ===')
              return 1 if fail else 0

          if __name__ == '__main__':
              sys.exit(main())
          PYEOF

      - name: 提交变动
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --staged --quiet; then
            echo "没有文件变动需要提交。"
            exit 0
          fi
          git commit -m "Chore: 自动解压并合并分卷压缩包"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
