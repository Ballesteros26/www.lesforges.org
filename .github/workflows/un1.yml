# -----------------------------------------------------------------------------
# 工作流：解压并合并分卷/分片压缩包（健壮版）
# - 识别 _part1/_part2...、_vol1、.part1 等分卷命名，归并为同一组
# - 同组所有分卷解压到同一文件夹（同名根目录自动合并）
# - 非分卷普通压缩包解压到各自独立同名文件夹
# - zip 文件名编码自动回退（UTF-8 flag 缺失时尝试 gbk/big5/latin-1...）
# - 含路径穿越检查、自然排序、失败退出码
# -----------------------------------------------------------------------------

name: 自动解压并合并分卷压缩包
on:
  push:
    branches: [ main, master, GM82 ]
    paths:
      - '**.zip'
      - '**.7z'
      - '**.rar'
      - '**.tar'
      - '**.tar.gz'
      - '**.tgz'
      - '**.tar.bz2'
      - '**.tar.xz'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract_all_archives:
    runs-on: ubuntu-22.04
    if: github.actor != 'github-actions[bot]'
    concurrency:
      group: extract-archives-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # rebase 需要足够历史

      - name: 安装解压依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y p7zip-full unrar

      - name: 查找、归组、解压合并、暂存并删除压缩包
        run: |
          python3 - <<'PYEOF'
          #!/usr/bin/env python3
          """解压并合并分卷压缩包，处理 Windows 文件名编码。"""
          import os, re, sys, shutil, subprocess, zipfile, tarfile
          from pathlib import Path

          ROOT = Path('.')

          ARCHIVE_EXTS = ('.zip', '.7z', '.rar', '.tar', '.tar.gz',
                          '.tar.bz2', '.tar.xz', '.tgz')
          PART_RE = re.compile(r'[._-](part|pt|vol)[0-9]{1,3}$', re.I)
          MAX_TOTAL_UNCOMPRESSED = 20 * 1024 * 1024 * 1024   # 20GB 防 zip bomb

          def is_archive(name: str) -> bool:
              low = name.lower()
              return any(low.endswith(ext) for ext in ARCHIVE_EXTS)

          def strip_ext(name: str) -> str:
              low = name.lower()
              for ext in sorted(ARCHIVE_EXTS, key=len, reverse=True):
                  if low.endswith(ext):
                      return name[:-len(ext)]
              return name

          def group_key(path: Path) -> Path:
              base = strip_ext(path.name)
              gbase = PART_RE.sub('', base)
              return path.parent / gbase

          def natural_key(p) -> list:
              return [int(t) if t.isdigit() else t.lower()
                      for t in re.split(r'(\d+)', str(p))]

          # ── zip 文件名编码修复 ──
          def fix_zip_name(info: zipfile.ZipInfo) -> str:
              name = info.filename
              if info.flag_bits & 0x800:          # 已标记 UTF-8
                  return name
              try:
                  raw = name.encode('cp437')      # 未标记时 unzip 按 CP437 解码
              except UnicodeEncodeError:
                  return name
              # 优先 UTF-8（很多工具写 UTF-8 字节但忘设 flag）
              for enc in ('utf-8', 'gbk', 'gb18030', 'big5',
                          'shift_jis', 'latin-1'):
                  try:
                      dec = raw.decode(enc)
                      if dec.encode(enc) == raw and \
                         not any(ord(c) < 32 for c in dec):
                          return dec
                  except (UnicodeDecodeError, UnicodeEncodeError):
                      continue
              return name

          def safe_target(dest: Path, name: str) -> Path:
              name = name.replace('\\', '/')
              parts = [p for p in name.split('/') if p not in ('', '.')]
              if any(p == '..' for p in parts):
                  raise ValueError(f'路径穿越: {name!r}')
              target = dest.joinpath(*parts)
              try:
                  target.resolve().relative_to(dest.resolve())
              except ValueError:
                  raise ValueError(f'路径穿越: {name!r}')
              return target

          total_uncompressed = 0
          def check_bomb(n: int):
              nonlocal total_uncompressed
              total_uncompressed += n
              if total_uncompressed > MAX_TOTAL_UNCOMPRESSED:
                  raise RuntimeError('解压总量超过上限，疑似 zip bomb')

          def extract_zip(path: Path, dest: Path):
              with zipfile.ZipFile(path) as zf:
                  for info in zf.infolist():
                      name = fix_zip_name(info)
                      if not name:
                          continue
                      target = safe_target(dest, name)
                      if info.is_dir() or name.endswith('/'):
                          target.mkdir(parents=True, exist_ok=True)
                          continue
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(info) as src, open(target, 'wb') as dst:
                          shutil.copyfileobj(src, dst)
                      check_bomb(info.file_size)
                      mode = (info.external_attr >> 16) & 0o777
                      if mode:
                          try: os.chmod(target, mode)
                          except OSError: pass

          def extract_tar(path: Path, dest: Path):
              with tarfile.open(path) as tf:
                  for m in tf.getmembers():
                      target = safe_target(dest, m.name)
                      if m.isdir():
                          target.mkdir(parents=True, exist_ok=True)
                          continue
                      if not m.isfile():          # 跳过符号链接/设备/管道
                          continue
                      target.parent.mkdir(parents=True, exist_ok=True)
                      src = tf.extractfile(m)
                      if src is None:
                          continue
                      with src, open(target, 'wb') as dst:
                          shutil.copyfileobj(src, dst)
                      check_bomb(m.size)
                      if m.mode:
                          try: os.chmod(target, m.mode & 0o777)
                          except OSError: pass

          def run(cmd):
              r = subprocess.run(cmd, capture_output=True)
              if r.returncode != 0:
                  raise RuntimeError(r.stderr.decode('utf-8', 'replace')[:800])

          def extract(path: Path, dest: Path):
              dest.mkdir(parents=True, exist_ok=True)
              low = path.name.lower()
              if low.endswith('.zip'):
                  extract_zip(path, dest)
              elif low.endswith(('.tar.gz', '.tgz', '.tar.bz2',
                                 '.tar.xz', '.tar')):
                  extract_tar(path, dest)
              elif low.endswith('.7z'):
                  run(['7z', 'x', str(path), f'-o{dest}', '-y', '-bso0', '-bsp0'])
              elif low.endswith('.rar'):
                  run(['unrar', 'x', '-o+', '-idq', str(path), f'{dest}/'])
              else:
                  raise ValueError(f'未知格式: {path}')

          def find_archives(root: Path) -> list[Path]:
              out = []
              for dirpath, dirnames, filenames in os.walk(root):
                  dirnames[:] = [d for d in dirnames if d != '.git']
                  for f in filenames:
                      if is_archive(f):
                          out.append(Path(dirpath) / f)
              return out

          def main() -> int:
              archives = find_archives(ROOT)
              if not archives:
                  print('未找到压缩文件。')
                  return 0
              print(f'找到 {len(archives)} 个压缩文件，开始归组...')

              groups: dict[Path, list[Path]] = {}
              for p in archives:
                  k = group_key(p)
                  groups.setdefault(k, []).append(p)
                  print(f'  归组: {p}  ->  {k}')

              fail = 0
              for key in sorted(groups, key=natural_key):
                  parts = sorted(groups[key], key=natural_key)
                  dest: Path = key
                  print(f'=== 组 ({len(parts)} 个分卷) -> {dest} ===')
                  ok = 0
                  for p in parts:
                      if not p.is_file():
                          continue
                      try:
                          print(f'  -> {p}')
                          extract(p, dest)
                          print('     解压成功，删除原文件。')
                          p.unlink()
                          run(['git', 'add', '--', str(p)])
                          ok += 1
                      except Exception as e:
                          print(f'     解压失败: {e}，保留该分卷。')
                          fail += 1
                  if ok > 0:
                      print(f'  -> 暂存合并目录: {dest}')
                      run(['git', 'add', '--force', '--', str(dest)])
                  try:
                      dest.rmdir()          # 仅当为空时删除
                  except OSError:
                      pass
              print(f'=== 全部处理完毕，失败分卷数: {fail} ===')
              return 1 if fail else 0

          sys.exit(main())
          PYEOF

      - name: 提交变动
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --staged --quiet; then
            echo "没有文件变动需要提交。"
            exit 0
          fi
          git commit -m "Chore: 自动解压并合并分卷压缩包"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
