name: Deploy to GitHub Pages  
  
on:  
  push:  
    branches: [main]   # 若默认分支是 master，改成 master  
  workflow_dispatch:  
  
permissions:  
  pages: write  
  id-token: write  
  
concurrency:  
  group: pages  
  cancel-in-progress: true  
  
jobs:  
  deploy:  
    runs-on: ubuntu-latest  
    environment:  
      name: github-pages  
      url: ${{ steps.deployment.outputs.page_url }}  
    steps:  
      - uses: actions/checkout@v4  
  
      - name: Prepare site  
        run: |  
          # 添加 .nojekyll，防止 Pages 用 Jekyll 处理而忽略下划线开头的目录  
          touch www.lesforges.org_20261126_131239/.nojekyll  
  
      - uses: actions/configure-pages@v5  
  
      - uses: actions/upload-pages-artifact@v3  
        with:  
          path: www.lesforges.org_20261126_131239  
  
      - id: deployment  
        uses: actions/deploy-pages@v4
